name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows/amd64
            artifact: windows_amd64
          - runner: ubuntu-24.04
            target: linux/amd64
            artifact: linux_amd64
          - runner: ubuntu-24.04-arm
            target: linux/arm64
            artifact: linux_arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Read version
        id: version
        shell: python
        run: |
          import os, pathlib, re
          version = pathlib.Path("VERSION").read_text(encoding="ascii").strip()
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), "VERSION must contain MAJOR.MINOR.PATCH"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag=v{version}\n")
      - name: Verify native code, race safety and dependencies
        run: python scripts/verify.py --race --security
      - name: Parse installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($path in @('install.ps1', 'scripts/install.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors -join [Environment]::NewLine) }
          }
      - name: Check shell syntax
        if: runner.os == 'Linux'
        run: |
          sh -n install.sh
          sh -n scripts/install.sh
      - name: Build candidate with native resources
        run: python scripts/package.py --version "${{ steps.version.outputs.tag }}" --target ${{ matrix.target }} --output "${{ runner.temp }}/mafsil-candidate"
      - name: Exercise CLI, stdio and release payload
        run: python tests/distribution_test.py --bundle "${{ runner.temp }}/mafsil-candidate"
      - name: Exercise installer and rollback in fixtures
        run: python tests/installer_test.py --bundle "${{ runner.temp }}/mafsil-candidate" -v
      - name: Exercise public bootstrap, README setup and update in a temporary home
        if: github.event_name != 'pull_request'
        run: python tests/bootstrap_online_test.py
      - name: Reject generated source changes
        run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ matrix.artifact }}
          path: ${{ runner.temp }}/mafsil-candidate/
          if-no-files-found: error
          retention-days: 14

  fuzz:
    name: Bounded parser fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./internal/terminal -fuzz=FuzzScreen -fuzztime=30s -parallel=2
      - run: go test ./internal/workspace -fuzz=FuzzName -fuzztime=30s -parallel=2
