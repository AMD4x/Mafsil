<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img" aria-label="Mafsil architecture and capability boundaries"><title>Mafsil architecture and capability boundaries</title><rect width="1100" height="410" rx="12" fill="#f5f2e9"/><text x="40" y="53" fill="#1c2c32" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="28" font-weight="600">Small surface. Clear capabilities.</text><rect x="40" y="128" width="235" height="150" rx="6" fill="#e8e8df"/><text x="62" y="170" fill="#1c2c32" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="25" font-weight="600">MCP client</text><text x="62" y="203" fill="#697c80" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="16" font-weight="400">Local stdio connection</text><rect x="369" y="128" width="296" height="150" rx="6" fill="#1c2c32"/><text x="391" y="170" fill="#f5f2e9" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="25" font-weight="600">Mafsil</text><text x="391" y="203" fill="#f5f2e9" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="16" font-weight="400">Read only by default</text><rect x="765" y="87" width="295" height="99" rx="6" fill="#e8e8df"/><text x="787" y="129" fill="#1c2c32" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="25" font-weight="600">Workspace files</text><text x="787" y="162" fill="#697c80" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="16" font-weight="400">Conditional, precise edits</text><rect x="765" y="228" width="295" height="99" rx="6" fill="#e8e8df"/><text x="787" y="270" fill="#1c2c32" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="25" font-weight="600">Processes + terminals</text><text x="787" y="303" fill="#697c80" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="16" font-weight="400">Explicitly enabled</text><path d="M278 202h86m-10-7l10 7-10 7M670 202h43V136h47m-10-7l10 7-10 7M713 202v75h47m-10-7l10 7-10 7" fill="none" stroke="#ea693c" stroke-width="3"/><text x="41" y="364" fill="#697c80" font-family="Segoe UI,DejaVu Sans,sans-serif" font-size="18" font-weight="400">File tools stay within your workspace. Commands run with your account’s authority.</text></svg>
